<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404｜这间展厅不存在 · 趣站博物馆</title>
  <meta name="description" content="你走到了一条没有挂画的走廊。回到门厅，继续逛趣站博物馆。">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#070b16">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse 40% 30% at 72% 16%, rgba(212, 170, 86, 0.2), transparent 70%),
        radial-gradient(ellipse 52% 42% at 24% 84%, rgba(70, 110, 180, 0.16), transparent 72%),
        #070b16;
      color: #f7edd8;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.8;
      background-image:
        radial-gradient(1.6px 1.6px at 12% 18%, rgba(255, 226, 160, 0.9), transparent 70%),
        radial-gradient(1px 1px at 26% 34%, rgba(255, 244, 220, 0.6), transparent 70%),
        radial-gradient(2px 2px at 38% 12%, rgba(244, 206, 120, 0.85), transparent 70%),
        radial-gradient(1px 1px at 52% 26%, rgba(255, 236, 200, 0.55), transparent 70%),
        radial-gradient(1.4px 1.4px at 66% 8%, rgba(255, 220, 150, 0.85), transparent 70%),
        radial-gradient(1px 1px at 78% 30%, rgba(255, 244, 220, 0.5), transparent 70%),
        radial-gradient(2.2px 2.2px at 88% 14%, rgba(244, 206, 120, 0.9), transparent 70%),
        radial-gradient(1px 1px at 18% 76%, rgba(255, 236, 200, 0.5), transparent 70%),
        radial-gradient(1.5px 1.5px at 34% 88%, rgba(255, 214, 140, 0.7), transparent 70%),
        radial-gradient(1px 1px at 62% 80%, rgba(255, 244, 220, 0.45), transparent 70%),
        radial-gradient(2px 2px at 82% 72%, rgba(244, 206, 120, 0.75), transparent 70%);
      background-repeat: no-repeat;
    }
    .ghost {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 0;
      transform: translate(-50%, -54%);
      color: rgba(247, 237, 216, 0.035);
      font-family: "Palatino Linotype", "Songti SC", "SimSun", serif;
      font-size: clamp(220px, 40vw, 520px);
      line-height: 0.8;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      padding: 52px 44px 40px;
      text-align: center;
      border: 1px solid rgba(212, 170, 86, 0.3);
      background: rgba(8, 13, 26, 0.76);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 80px rgba(212, 170, 86, 0.08);
    }
    main::before,
    main::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: rgba(244, 214, 140, 0.7);
      border-style: solid;
    }
    main::before { left: -1px; top: -1px; border-width: 2px 0 0 2px; }
    main::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }
    .kicker {
      margin: 0 0 16px;
      color: #d4aa56;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
    }
    h1 {
      margin: 0;
      font-family: "Palatino Linotype", "Songti SC", "SimSun", serif;
      font-size: clamp(34px, 6.2vw, 58px);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.06em;
      text-indent: 0.06em;
      text-shadow: 0 0 28px rgba(232, 190, 96, 0.3);
    }
    .lead {
      max-width: 480px;
      margin: 18px auto 0;
      color: rgba(247, 237, 216, 0.74);
      font-size: 15px;
      line-height: 1.9;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }
    .actions a {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid rgba(247, 237, 216, 0.28);
      color: #f7edd8;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .actions a:hover {
      border-color: rgba(244, 214, 140, 0.8);
      background: rgba(244, 214, 140, 0.08);
    }
    .actions .primary {
      border-color: #d4aa56;
      background: #d4aa56;
      color: #17130a;
      font-weight: 600;
    }
    .actions .primary:hover {
      background: #f0cd82;
      border-color: #f0cd82;
    }
    .foot {
      margin: 30px 0 0;
      color: rgba(247, 237, 216, 0.38);
      font-size: 12px;
      letter-spacing: 0.12em;
    }
    @media (max-width: 520px) {
      body { padding: 16px; }
      main { padding: 38px 22px 30px; }
      .lead { font-size: 14px; }
      .actions { flex-direction: column; }
      .actions a { width: 100%; }
      .foot { letter-spacing: 0.04em; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="ghost" aria-hidden="true">404</div>
  <main>
    <p class="kicker">404 · 走到没有画的走廊</p>
    <h1>这间展厅不存在</h1>
    <p class="lead">可能是链接写错了，也可能这件展品还没布展。回到门厅，继续逛。</p>
    <div class="actions">
      <a class="primary" href="/">回到门厅</a>
      <a href="https://youquhome.com/">去有趣网址之家</a>
    </div>
    <p class="foot">趣站博物馆 · 一个可以走进去逛的 3D 网址博物馆</p>
  </main>
</body>
</html>
