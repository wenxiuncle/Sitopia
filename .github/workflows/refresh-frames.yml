name: refresh-frames

on:
  schedule:
    # 北京时间上午。GitHub 在每小时整点最挤，排上的定时任务会被丢掉，所以不写 09:00。
    # 09:41 是补跑：09:07 那次没被排上时，这次还能抓。没有新文章就不会提交。
    - cron: "7 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "41 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      full:
        description: 重读四个分类的全部文章
        type: boolean
        default: false

concurrency:
  group: refresh-frames
  cancel-in-progress: false

permissions:
  contents: write

run-name: ${{ (inputs.full == true || inputs.full == 'true') && '全部重抓' || '抓取新文章' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 拉取展品
        run: node tools/fetch-sites.mjs ${{ (inputs.full == true || inputs.full == 'true') && '--full' || '' }}
      - name: 有变化就提交
        run: |
          git config user.name "Wenxi闻西"
          git config user.email "226676894+wenxiuncle@users.noreply.github.com"
          if git diff --quiet -- data/sites.json; then
            echo "unchanged"
            exit 0
          fi
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const data = JSON.parse(readFileSync('data/sites.json','utf8')); writeFileSync('data/refresh.json', JSON.stringify({ at: new Date().toISOString(), count: data.count || 0, missingPortal: data.missingPortal || 0 }) + '\n');"
          git add data/sites.json data/refresh.json
          git commit -m "${{ (inputs.full == true || inputs.full == 'true') && '重读馆内画框' || '更新馆内画框' }}"
          git push
